/* ---- v7 motion ---- */
@keyframes upIn{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0;transform:translate3d(0,6px,0)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{opacity:0;transform:translate3d(0,28px,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes flashSc{0%{color:#ffd166;transform:scale(1.16);text-shadow:0 0 14px rgba(255,209,102,.7)}100%{transform:none;text-shadow:none}}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes pulse{50%{opacity:.35}}
.det{animation:none}.det.opening{animation:upIn .24s cubic-bezier(.2,.7,.2,1)}
.ani{animation:upIn .28s cubic-bezier(.2,.7,.2,1) both}.vin{animation:viewIn .22s ease-out}
.ov:not(.hide) .ovp{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
button,.wb,.tvl,.tmp,.gt,.sr,.wp{transition:transform .14s ease-out,background-color .18s,border-color .18s,box-shadow .2s}
button:active,.wb:active,.gt:active,.sr:active,.wp:active,.card .hd:active{transform:scale(.97)}
.card .hd{transition:transform .14s ease-out}
.sc.flash{display:inline-block;animation:flashSc .7s ease-out}
.enter .mbar i{animation:barIn .5s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}.enter .mhf.r .mbar i{transform-origin:right}

.skel.sm{height:64px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.skel{animation:none}}
/* v8: no scrollbar flash — inside scroll containers animate opacity only */

/* ---- v10: iPhone safe areas ---- */
html{background:var(--bg)}body{padding:0 env(safe-area-inset-right) calc(40px + env(safe-area-inset-bottom)) env(safe-area-inset-left)!important;overscroll-behavior-y:none}
header.hx{padding-top:calc(8px + env(safe-area-inset-top));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
.ov{padding:calc(8px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.ovp{max-height:calc(100vh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.ovb{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.brand{overflow:hidden}.hx h1{overflow:hidden;text-overflow:ellipsis}
@media(max-width:430px){.hx h1{font-size:15px}.tabs button{padding-left:9px;padding-right:9px}}
/* ---- v10: responsive (tablet / desktop) ---- */
@keyframes panelIn{from{opacity:0;transform:translate3d(40px,0,0)}to{opacity:1;transform:none}}
@media(min-width:768px){
  main{max-width:1180px;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  main .card.open{grid-column:1/-1}
  #fantasy{max-width:1000px}#standings{max-width:1180px}
  .ov{align-items:center}.ovp{max-width:640px;margin:0;max-height:86vh}
  .wh,.wp{grid-template-columns:22px 40px 1fr 80px 80px 60px;gap:10px}.wh{grid-template-columns:1fr 80px 80px 60px;padding-left:94px}
  .wfoot{max-width:1180px;margin-left:auto;margin-right:auto}
}
@media(min-width:1100px){
  main{max-width:1440px;grid-template-columns:repeat(3,minmax(0,1fr))}
  #standings{max-width:1440px}#fantasy{max-width:1440px}.wfoot{max-width:1440px}
  .ov{justify-content:flex-end;align-items:stretch;padding:0}
  .ovp{max-width:520px;width:520px;height:100vh;max-height:100vh;border-radius:22px 0 0 22px;border-right:0}
  .ov:not(.hide) .ovp{animation:panelIn .26s cubic-bezier(.2,.8,.2,1)}
  .fsplit{display:grid;grid-template-columns:minmax(360px,460px) minmax(0,1fr);gap:20px;align-items:start}
  .fsl{position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto;padding:4px 6px 4px 2px}
  .fsl .hint{display:none}.fsd #backL{visibility:hidden}
  .fsl .mcard.sel{outline:2px solid var(--acc);outline-offset:2px}
  .fsplit .ani{animation-name:fadeOnly}
}
@media(hover:hover) and (pointer:fine){
  .card:hover{border-color:rgba(255,255,255,.16);box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .tm .nm .tlink:hover,.stn:hover{color:var(--acc)}
  .sbtn:hover,.tabs button:hover{filter:brightness(1.15)}
  .wb:hover{transform:translateY(-1px)}
  html.light .card:hover{border-color:rgba(13,20,38,.18);box-shadow:0 12px 26px rgba(13,20,38,.12)}
}
/* ---- v11: measured tab pill ---- */
.hx .tabs{display:flex!important;grid-template-columns:none}
.hx .tabs button{flex:0 0 auto;white-space:nowrap}
.hx .tabs:before,.hx .tabs:has(#tT.on):before,.hx .tabs:has(#tF.on):before{left:0;width:var(--pw,0);transform:translateX(var(--px,0))!important;transition:transform .28s cubic-bezier(.3,1.1,.5,1),width .28s cubic-bezier(.3,1.1,.5,1);box-shadow:0 1px 6px color-mix(in srgb,var(--acc) 30%,transparent)!important}
.hx .tabs.nopill:before{transition:none}
/* ---- v11: swipe dates ---- */
#games{touch-action:pan-y}.tw{touch-action:pan-x pan-y}
#games.drag{transition:none}#games.snap{transition:transform .2s ease-out,opacity .2s ease-out}
.swh{position:fixed;top:50%;z-index:30;width:42px;height:42px;margin-top:-21px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--acc);color:#fff;font-size:22px;font-weight:900;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.swh.l{left:10px}.swh.r{right:10px}.swh.ready{transform:scale(1.12)}
/* ---- v11: pull to refresh ---- */
.ptr{position:fixed;left:50%;z-index:4;width:40px;height:40px;margin-left:-20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#141c2e;border:1px solid #2a3654;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;pointer-events:none;font-size:22px}
.ptr.go{transition:transform .25s ease-out,opacity .25s}.ptr.spin span{animation:spin .8s linear infinite}.ptr span{display:inline-block}
.ptrmsg{position:fixed;left:50%;transform:translateX(-50%);z-index:4;background:#141c2e;border:1px solid #2a3654;color:#e8edf5;font-size:12px;font-weight:800;border-radius:999px;padding:5px 12px;opacity:0;transition:opacity .25s;pointer-events:none}
.ptrmsg.on{opacity:1}
html.light .ptr,html.light .ptrmsg{background:#fff;border-color:#d5dce8;color:#1c2536}
/* ---- v11 add-ons ---- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(180deg,#1d2a44,#0b0f17);transition:opacity .35s ease-out}
#splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.45)}#splash b{color:#fff;font-size:22px;font-weight:900;letter-spacing:.3px}
#splash.out{opacity:0;pointer-events:none}
.offb{position:sticky;top:calc(var(--hh,60px));z-index:4;margin:8px auto 0;max-width:720px;width:calc(100% - 20px);background:#3a2a0b;border:1px solid #f59e0b;color:#fde7b0;font-size:12.5px;font-weight:700;border-radius:12px;padding:7px 12px;text-align:center}
html.light .offb{background:#fff7e6;color:#7c4a03}
.shb{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;border:1px solid #263247;background:rgba(255,255,255,.03);color:#cfd6e4;cursor:pointer;flex:none;padding:0}
.watch .shb{margin-left:auto}.watch .shb+.wb.gp{margin-left:0}

html.light .shb{border-color:#d5dce8;background:#fff;color:#3b475e}
.grab{display:none}
@media(max-width:1099px){.grab{display:block;flex:none;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:8px auto 0;cursor:grab}

function watchLinks(names,teams){const out=[],seen=new Set();for(const n of names){const m=WATCH.find(w=>w[0].test(n));if(!m||seen.has(m[1]))continue;seen.add(m[1]);out.push({label:m[1],url:m[2],logo:m[3],tag:m[4]})}

  return {id:e.team.id,abbr:e.team.abbreviation,name:e.team.shortDisplayName||e.team.displayName,logo:e.team.logos?.[0]?.href,seed:+s.playoffseed||99,w:+s.wins||0,l:+s.losses||0,pct:s.winpercent,gb:s.gamesbehind,strk:s.streak,l10:s.lasttengames,home:s.home,road:s.road,diff:s.differential}}).sort((a,b)=>a.seed-b.seed)}))}

  const _toast=toast;toast=function(t,s,id,ic){haptic();PEND++;badge();return _toast(t,s,id,ic)};
  // badge
  let PEND=0;function badge(){try{if(!navigator.setAppBadge)return;const n=(lastData?.events||[]).filter(e=>closeInfo(e)).length+PEND;
    if(document.hidden&&n)navigator.setAppBadge(n);else if(!document.hidden){PEND=0;navigator.clearAppBadge&&navigator.clearAppBadge()}}catch(e){}}
  document.addEventListener('visibilitychange',badge);
  // share
  const SHIC='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
  const BASE=location.origin+location.pathname;
  async function shareLink(url,title,text){haptic();try{if(navigator.share){await navigator.share({title,text,url});return}}catch(e){if(e&&e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(url);toast('Link copied',title,'','🔗')}catch(e){prompt('Copy this link',url)}}
  function addShares(){document.querySelectorAll('#games .card .watch').forEach(w=>{if(w.querySelector('.shb'))return;const id=w.closest('.card').dataset.id,gp=w.querySelector('.gp');
      const b=Object.assign(document.createElement('button'),{className:'shb',innerHTML:SHIC,title:'Share game'});b.setAttribute('aria-label','Share game');b.dataset.share='game:'+id;w.insertBefore(b,gp)});
    const lh=document.querySelector('#fantasy .fsd .lhead,#fantasy .fview>.lhead');if(lh&&lh.querySelector('#backL')&&!lh.querySelector('.shb'))lh.insertAdjacentHTML('beforeend',`<button class="shb" data-share="matchup" title="Share matchup" aria-label="Share matchup">${SHIC}</button>`);
    const rs=document.querySelector('#fantasy .rsel');if(rs&&!rs.querySelector('.shb'))rs.insertAdjacentHTML('beforeend',`<button class="shb" data-share="recap" title="Share recap" aria-label="Share recap">${SHIC}</button>`)}
  const _pp=postPaint;postPaint=function(){_pp();try{addShares();if(DL_G){const c=document.querySelector(`.card[data-id="${DL_G}"]`);if(c){c.scrollIntoView({block:'start',behavior:RM?'auto':'smooth'});DL_G=null}}hideSplash()}catch(e){}};
  document.addEventListener('click',e=>{const b=e.target.closest('[data-share]');if(!b)return;e.stopPropagation();const k=b.dataset.share;
    if(k.startsWith('game:')){const id=k.slice(5),ev=(lastData?.events||[]).find(x=>x.id===id);const g=ev&&parseGame(ev);const nm=g?`${g.teams[0].abbr} @ ${g.teams[1].abbr}`:'NBA game';
      shareLink(`${BASE}#date=${cur}&game=${id}`,nm+' · NBA Live',g&&g.state!=='pre'&&!SET.ns?`${g.teams[0].abbr} ${g.teams[0].score} – ${g.teams[1].abbr} ${g.teams[1].score} (${g.status})`:nm)}
    else if(k==='matchup'&&FDATA&&UI.matchup!=null){const m=FDATA.matchups[UI.matchup],A=FDATA.teams[m[0]],B=FDATA.teams[m[1]];shareLink(`${BASE}#tab=fantasy&m=${m[0]}`,`${A.name} vs ${B?B.name:''} · Week ${FDATA.week}`,SET.ns?'':`${A.total.toFixed(2)} – ${B?B.total.toFixed(2):''}`)}
    else if(k==='recap'&&FDATA){const wk=UI.rw||FDATA.week;shareLink(`${BASE}#tab=fantasy&recap=${wk}`,`${FDATA.league} · Week ${wk} recap`,'')}},true);
  // splash
  const SPL=$('splash');let splT=setTimeout(()=>hideSplash(),3500);function hideSplash(){if(!SPL||SPL.classList.contains('out'))return;if(!lastData&&!FDATA&&Date.now()-T0<3400)return;clearTimeout(splT);SPL.classList.add('out');setTimeout(()=>SPL.remove(),400)}
  // offline banner
  const OFB=document.createElement('div');OFB.className='offb hide';document.querySelector('header').after(OFB);
  addEventListener('nba-offline',e=>{OFB.textContent='No connection — showing last update at '+new Date(e.detail).toLocaleString('en-US',{timeZone:TZ,month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'})+' '+TZL;OFB.classList.remove('hide')});
  addEventListener('nba-online',()=>OFB.classList.add('hide'));
  if(location.protocol==='https:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  // swipe-down-to-close sheets
  const wideQ=matchMedia('(min-width:1100px)');
  document.querySelectorAll('.ov .ovp').forEach(p=>{p.insertAdjacentHTML('afterbegin','<div class="grab" aria-hidden="true"></div>');let s=null;
    p.addEventListener('touchstart',e=>{if(wideQ.matches||e.touches.length!==1)return;const b=p.querySelector('.ovb');const onGrab=!!e.target.closest('.grab,.ovh');
      if(!onGrab&&b&&(b.scrollTop>0||!b.contains(e.target)))return;if(e.target.closest('.tw,input,select,textarea'))return;s={y:e.touches[0].clientY,x:e.touches[0].clientX,t:Date.now(),dy:0,lock:null}},{passive:true});
    p.addEventListener('touchmove',e=>{if(!s)return;const dy=e.touches[0].clientY-s.y,dx=e.touches[0].clientX-s.x;
      if(!s.lock){if(Math.abs(dy)<8&&Math.abs(dx)<8)return;s.lock=dy>0&&Math.abs(dy)>Math.abs(dx)*1.3?'y':'n'}if(s.lock!=='y'){s=null;return}
      e.preventDefault();s.dy=Math.max(0,dy);p.classList.add('dragging');p.style.transform=`translate3d(0,${s.dy}px,0)`},{passive:false});
    p.addEventListener('touchend',()=>{if(!s)return;const v=s.dy/Math.max(1,Date.now()-s.t),ov=p.closest('.ov');p.classList.remove('dragging');
      if(s.dy>120||(v>.6&&s.dy>40)){haptic();if(!RM){p.classList.add('snapb');p.style.transform='translate3d(0,110%,0)';setTimeout(()=>{ov.classList.add('hide');p.classList.remove('snapb');p.style.transform=''},200)}else{ov.classList.add('hide');p.style.transform=''}}
      else{p.classList.add('snapb');p.style.transform='';setTimeout(()=>p.classList.remove('snapb'),230)}s=null})});
  // deep links / shortcuts
  (function(){const P=new URLSearchParams(location.search),H=new URLSearchParams(location.hash.slice(1)),g=k=>H.get(k)||P.get(k);
    const tab={scores:'tS',standings:'tT',fantasy:'tF'}[g('tab')];if(g('date')&&/^\d{4}-\d{2}-\d{2}$/.test(g('date'))){cur=g('date')}
    if(g('game')){DL_G=g('game');open.add(DL_G);showTab('tS')}else if(tab)showTab(tab);
    if(g('m')){DL_M=g('m');UI.sub='m';showTab('tF')}if(g('recap')){UI.sub='r';UI.rw=+g('recap')||null;showTab('tF')}
    if(location.hash||P.get('tab'))history.replaceState(null,'',location.pathname)})();
  load(true);
}
</script></body></html>
